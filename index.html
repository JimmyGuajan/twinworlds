<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwinWorlds</title>
  <meta name="description" content="Find Earth's twin for every Moon and Mars base site using open NASA data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=202610132007">
</head>
<body data-stage="intro">
  <div id="globe" aria-label="3D globe"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- the ship that travels between worlds -->
  <svg id="ship" class="ship" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ff9b47"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path class="flame" d="M26 44 L32 62 L38 44 Z" fill="url(#flame)"/>
    <path d="M32 4 C42 14 44 28 42 44 L22 44 C20 28 22 14 32 4 Z" fill="#e7ecf6"/>
    <circle cx="32" cy="24" r="5" fill="#36c2b4" stroke="#0d1424" stroke-width="2"/>
    <path d="M22 34 L12 46 L22 44 Z M42 34 L52 46 L42 44 Z" fill="#ff9b47"/>
  </svg>

  <header class="top">
    <button class="brand" id="homeBtn" title="Inicio">
      <svg viewBox="0 0 40 40" class="logo" aria-hidden="true"><circle cx="14" cy="20" r="10" fill="#36c2b4"/><circle cx="27" cy="20" r="10" fill="none" stroke="#ff9b47" stroke-width="3"/></svg>
      <span>TwinWorlds</span>
    </button>
    <ol class="progress" id="progress"></ol>
    <div class="lang" id="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div>
  </header>

  <!-- INTRO -->
  <section class="hero" id="hero">
    <p class="kicker" data-i="tagline"></p>
    <h1 data-i="heroTitle"></h1>
    <p class="sub" data-i="heroSub"></p>
    <div class="cta-row">
      <button class="cta" id="startBtn"><span data-i="start"></span> →</button>
      <button class="cta-alt" id="earthBtn">🌍 <span data-i="earthStart"></span></button>
    </div>
    <div class="hero-logos">NASA POWER · LRO LOLA · LRO Diviner · MGS MOLA · Mars Odyssey · NASA GIBS · NASA Trek</div>
  </section>

  <!-- MAIN PANEL (steps) -->
  <aside class="panel" id="panel" aria-live="polite"></aside>

  <!-- mission computer -->
  <div class="terminal" id="terminal" hidden>
    <div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><b data-i="computer"></b></div>
    <pre id="termBody"></pre>
  </div>

  <!-- tooltip for globe -->
  <div class="hint" id="hint" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.4/dist/globe.gl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/data.js?v=202610132007"></script>
  <script src="js/grid.js?v=202610132007"></script>
  <script src="js/engine.js?v=202610132007"></script>
  <script src="js/i18n.js?v=202610132007"></script>
  <script src="js/app.js?v=202610132007"></script>
</body>
</html>
